<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0e131d">
    <link rel="icon" href="data:,">
    <title>EVM Abstract Lab · Analysis workspace</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e131d; color: #e0e9f4; font: 16px system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #boot { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; padding: 24px; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      #boot strong { color: #63d6ca; font-size: 24px; letter-spacing: .04em; }
      #boot span { color: #91a4ba; max-width: 600px; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="boot" role="status"><strong>EVM ABSTRACT LAB</strong><span>Starting the WebGPU analysis workspace…</span></div>
    <div id="analysis-status" class="sr-only" role="status" aria-live="polite">Starting</div>
    <canvas id="evm-canvas" aria-label="EVM analysis workspace: bytecode, disassembly, SSA and control-flow graph"></canvas>
    <script type="module">
      try {
        if (!window.isSecureContext) {
          throw new Error('WebGPU requires a secure context. Open this workspace over HTTPS or localhost.');
        }
        if (!navigator.gpu) {
          throw new Error('WebGPU is unavailable in this browser. Use a browser with WebGPU support and enable graphics acceleration.');
        }
        const { default: init, start } = await import('./evm_abstract_web.js');
        await init();
        try {
          await start('evm-canvas');
        } catch (cause) {
          throw new Error('The browser could not create a usable WebGPU graphics device. Check WebGPU support and graphics acceleration.', { cause });
        }
        document.getElementById('boot').remove();
      } catch (error) {
        const message = `Unable to start WebGPU: ${error instanceof Error ? error.message : error}`;
        document.querySelector('#boot span').textContent = message;
        document.getElementById('boot').setAttribute('role', 'alert');
        document.getElementById('analysis-status').textContent = `Error: ${message}`;
        console.error(error);
      }
    </script>
  </body>
</html>
