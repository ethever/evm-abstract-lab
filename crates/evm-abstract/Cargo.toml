[package]
name                   = "evm-abstract"
description            = "A learning library for native cross-contract EVM abstract execution and frame-aware SSA"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[features]
default = []
imbl    = ["snapshot-state/imbl"]

[dependencies]
evm-bytecode = { path = "../evm-bytecode" }
evm-domain = { path = "../evm-domain" }
evm-resource = { path = "../evm-resource" }
analysis-kernel = { path = "../analysis-kernel" }
evm-abstract-notation = { path = "../evm-abstract-notation" }
snapshot-state = { path = "../snapshot-state" }
symbolic-structure = { path = "../symbolic-structure", features = ["serde"] }
alloy-primitives.workspace = true
alloy.workspace = true
revm-bytecode.workspace = true
petgraph.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
tower.workspace = true
analysis-control = { path = "../analysis-control" }
revm-precompile = { version = "=43.0.3", default-features = false, features = [
    "std",
    "c-kzg",
] }

[dev-dependencies]
evm-domain         = { path = "../evm-domain", features = ["test-support"] }
evm-resource       = { path = "../evm-resource", features = ["test-support"] }
proptest.workspace = true
revm               = { version = "=43.0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
