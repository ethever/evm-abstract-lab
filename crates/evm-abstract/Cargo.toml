[package]
name                   = "evm-abstract"
description            = "A learning library for native cross-contract EVM abstract execution and frame-aware SSA"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[features]
default = []
imbl    = ["snapshot-state/imbl"]

[dependencies]
evm-abstract-notation = { path = "../evm-abstract-notation" }
snapshot-state = { path = "../snapshot-state" }
alloy-primitives.workspace = true
revm-bytecode.workspace = true
petgraph.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
num-bigint.workspace = true
num-integer.workspace = true
num-traits.workspace = true
embedded-smt = { path = "../embedded-smt" }
revm-precompile = { version = "=43.0.3", default-features = false, features = [
    "std",
    "c-kzg",
] }

[dev-dependencies]
proptest.workspace = true
revm               = { version = "=43.0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
