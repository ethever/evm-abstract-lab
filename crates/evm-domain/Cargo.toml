[package]
name                   = "evm-domain"
description            = "Shared static EVM numeric algebras, value identities and bounded symbolic semantics"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[features]
default      = []
test-support = ["evm-bytecode/test-support"]

[dependencies]
analysis-control           = { path = "../analysis-control" }
analysis-kernel            = { path = "../analysis-kernel" }
evm-bytecode               = { path = "../evm-bytecode" }
evm-resource               = { path = "../evm-resource" }
symbolic-structure         = { path = "../symbolic-structure", features = ["serde"] }
alloy-primitives.workspace = true
num-bigint.workspace       = true
num-integer.workspace      = true
num-traits.workspace       = true
revm-bytecode.workspace    = true
serde.workspace            = true
thiserror.workspace        = true

[dev-dependencies]
evm-bytecode         = { path = "../evm-bytecode", features = ["test-support"] }
evm-resource         = { path = "../evm-resource", features = ["test-support"] }
proptest.workspace   = true
serde_json.workspace = true

[lints]
workspace = true
