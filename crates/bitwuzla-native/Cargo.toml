[package]
name                   = "bitwuzla-native"
description            = "Safe session-owned Bitwuzla adapter with cooperative non-clock resource limits"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
thiserror.workspace = true

[build-dependencies]
cc.workspace         = true
pkg-config.workspace = true

# The manual ABI is the only unsafe boundary. Application crates retain the
# workspace-wide forbid; src/ffi.rs documents and locally allows its operations.
[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
wildcard_imports = "deny"
