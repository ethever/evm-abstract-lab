[package]
name                   = "evm-abstract-server"
description            = "Local HTTP host and native analysis backend for the egui web workbench"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[features]
capture-replay = []

[dependencies]
alloy-primitives.workspace = true
axum.workspace             = true
hyper.workspace            = true
hyper-util.workspace       = true
tower-http.workspace       = true
tokio                      = { workspace = true, features = ["fs", "io-util", "sync"] }
tokio-io-timeout.workspace = true
evm-abstract               = { path = "../evm-abstract" }
evm-abstract-protocol      = { path = "../evm-abstract-protocol" }
serde_json.workspace       = true
reqwest.workspace          = true
serde.workspace            = true
thiserror.workspace        = true
clap.workspace             = true

[dev-dependencies]
# Keep package/feature CLI requests distinct from this self dev-dependency.
evm-abstract-server-capture = { package = "evm-abstract-server", path = ".", features = [
    "capture-replay",
] }
async-compression = { workspace = true, features = [
    "tokio",
    "zstd",
    "brotli",
    "gzip",
] }

[lints]
workspace = true
