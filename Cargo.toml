[workspace]
members = [
    "crates/analysis-control",
    "crates/analysis-kernel",
    "crates/evm-decompile",
    "crates/evm-decompile-model",
    "crates/evm-abstract",
    "crates/evm-abstract-cli",
    "crates/evm-abstract-layout",
    "crates/evm-abstract-notation",
    "crates/evm-abstract-protocol",
    "crates/evm-abstract-server",
    "crates/evm-abstract-web",
    "crates/evm-bytecode",
    "crates/evm-domain",
    "crates/evm-resource",
    "crates/snapshot-state",
    "crates/symbolic-structure",
]
exclude = ["lints/no_dyn"]
resolver = "3"

[workspace.metadata.dylint]
libraries = [{ path = "lints/no_dyn" }]

[workspace.package]
version      = "0.4.0"
edition      = "2024"
rust-version = "1.99"
license      = "MIT"
repository   = "https://github.com/ethever/evm-abstract-lab"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = [
    "tokio",
    "service",
    "server-graceful",
    "http1",
] }
tower = { version = "=0.5.3", default-features = false }
tower-http = { version = "=0.6.11", default-features = false, features = [
    "compression-zstd",
    "compression-br",
    "compression-gzip",
] }
async-compression = { version = "=0.4.42", default-features = false }
tokio-io-timeout = "=1.2.1"
alloy = { version = "=2.5.0", default-features = false, features = [
    "std",
    "rpc-client",
    "rpc-types",
    "json-rpc",
    "reqwest",
    "reqwest-rustls-tls",
] }
alloy-primitives = { version = "=1.7.3", features = ["serde"] }
revm-bytecode = "=43.0.0"
petgraph = "=0.8.3"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
clap = { version = "=4.6.7", features = ["derive"] }
proptest = "=1.11.0"
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
tokio = { version = "=1.53.2", features = ["rt", "time", "macros", "net"] }
reqwest = { version = "=0.13.4", default-features = false, features = [
    "json",
    "rustls",
] }

[workspace.lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
wildcard_imports = "deny"

# Development and tests share cheap, incremental code generation. Keep the
# runtime checks enabled so the fast test suite still catches arithmetic bugs.
[profile.dev]
opt-level        = 0
debug            = 0
lto              = "off"
codegen-units    = 256
incremental      = true
debug-assertions = true
overflow-checks  = true

# Cargo's test profile inherits dev; cargo test needs no extra profile flag.
[profile.test]
opt-level = 0

# Installed CLI, server and Wasm artifacts favor runtime optimization over
# compilation speed. Benchmarks inherit these settings from release.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
incremental   = false
debug         = 0
strip         = "debuginfo"
