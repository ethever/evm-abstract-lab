[workspace]
members = [
    "crates/bitwuzla-native",
    "crates/embedded-smt",
    "crates/evm-abstract",
    "crates/evm-abstract-cli",
    "crates/evm-abstract-protocol",
    "crates/evm-abstract-server",
    "crates/evm-abstract-web",
    "crates/snapshot-state",
]
exclude = ["lints/no_dyn"]
resolver = "3"

[workspace.metadata.dylint]
libraries = [{ path = "lints/no_dyn" }]

[workspace.package]
version      = "0.4.0"
edition      = "2024"
rust-version = "1.99"
license      = "MIT"
repository   = "https://github.com/ethever/evm-abstract-lab"

[workspace.dependencies]
alloy-primitives = { version = "=1.7.3", features = ["serde"] }
revm-bytecode = "=43.0.0"
petgraph = "=0.8.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
clap = { version = "=4.6.7", features = ["derive"] }
proptest = "=1.11.0"
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
z3 = "=0.20.2"
cvc5 = "=0.6.0"
cc = "=1.5.1"
pkg-config = "=0.3.34"
reqwest = { version = "=0.13.4", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }

[workspace.lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
wildcard_imports = "deny"
